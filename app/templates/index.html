<!DOCTYPE html>
<html>
<head>
  <title>PQC Square App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container text-center p-4">
  <h2>Post-Quantum Cryptography</h2>

  <div class="row justify-content-center">
    <div class="col-md-5 border rounded p-3 m-2">
      <h5>KEM (McEliece)</h5>
      <button class="btn btn-primary mb-2" onclick="post('/kem-keygen')">Generate KEM Keys</button>
      <button class="btn btn-success mb-2" onclick="post('/kem-encrypt')">Encrypt</button>
      <button class="btn btn-warning mb-2" onclick="post('/kem-decrypt')">Decrypt</button>
    </div>

    <div class="col-md-5 border rounded p-3 m-2">
      <h5>Signature (SPHINCS+)</h5>
      <button class="btn btn-primary mb-2" onclick="post('/sig-keygen')">Generate Sig Keys</button>
      <input type="text" id="sig-msg" placeholder="Message" class="form-control mb-2">
      <button class="btn btn-success mb-2" onclick="sign()">Sign</button>
      <button class="btn btn-warning mb-2" onclick="verify()">Verify</button>
    </div>
  </div>

  <pre id="result" class="mt-4 border p-3 bg-light text-start"></pre>

  <script>
    function post(url, data = {}) {
      fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams(data)
      })
      .then(res => res.json())
      .then(data => document.getElementById('result').textContent = JSON.stringify(data, null, 2));
    }

    function sign() {
      const msg = document.getElementById('sig-msg').value;
      post('/sign', {message: msg});
    }

    function verify() {
      const msg = document.getElementById('sig-msg').value;
      post('/verify', {message: msg});
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-Quantum Cryptography Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">🔐 Post-Quantum Cryptography Demo</h1>

    <!-- KEM Section -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">Key Encapsulation Mechanism (KEM)</div>
      <div class="card-body">
        <button class="btn btn-primary mb-2" onclick="kemKeygen()">🔑 Generate KEM Keys</button>
        <button class="btn btn-success mb-2" onclick="kemEncrypt()">🔐 Encrypt</button>
        <button class="btn btn-warning mb-2" onclick="kemDecrypt()">🔓 Decrypt</button>
      </div>
    </div>

    <!-- Signature Section -->
    <div class="card mb-4">
      <div class="card-header bg-secondary text-white">Digital Signature (SPHINCS+)</div>
      <div class="card-body">
        <button class="btn btn-primary mb-2" onclick="sigKeygen()">🔑 Generate Signature Keys</button>

        <div class="mb-3">
          <label for="sig-msg" class="form-label">Message to Sign/Verify:</label>
          <input type="text" id="sig-msg" class="form-control" placeholder="Enter your message">
        </div>

        <button class="btn btn-success mb-2" onclick="sign()">✍️ Sign Message</button>
        <button class="btn btn-warning mb-2" onclick="verify()">✅ Verify Signature</button>
      </div>
    </div>

    <!-- Result Display -->
    <div class="card">
      <div class="card-header bg-dark text-white">Output</div>
      <div class="card-body">
        <pre id="result" style="white-space: pre-wrap;"></pre>
      </div>
    </div>
  </div>

  <!-- JS scripts -->
  <script>
    async function post(url, json = {}) {
      const res = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(json)
      });
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }

    function kemKeygen() { post("/kem-keygen"); }
    function kemEncrypt() { post("/kem-encrypt"); }
    function kemDecrypt() { post("/kem-decrypt"); }

    function sigKeygen() { post("/sig-keygen"); }

    function sign() {
      const msg = document.getElementById("sig-msg").value;
      post("/sign", { message: msg });
    }

    function verify() {
      const msg = document.getElementById("sig-msg").value;
      post("/verify", { message: msg });
    }
  </script>
</body>
</html>
